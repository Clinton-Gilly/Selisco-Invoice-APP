version: '3.8'

services:
  selisco-dashboard:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: selisco-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - PORT=3000
    env_file:
      - ./backend/.env.local
